<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fullscreen spam lol</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background: black;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #mainVideo {
      display: none;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #startText {
      color: white;
      font-family: sans-serif;
      font-size: 2rem;
      position: absolute;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="startText"></div>

  <video id="mainVideo" loop>
    <source src="video.mp4" type="video/mp4" />
    ur browser doesn't support video :(
  </video>

  <script>
    const video = document.getElementById('mainVideo');
    const text = document.getElementById('startText');

    const toggleFullscreen = async () => {
      if (!document.fullscreenElement) {
        await video.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    };

    const startSpamLoop = async () => {
      for (let i = 0; i < 10; i++) { // change 10 to however many toggles u want
        await toggleFullscreen();
        await new Promise(res => setTimeout(res, 300)); // 300ms between flips
      }
    };

    const startVideo = async () => {
      text.style.display = 'none';
      video.style.display = 'block';
      video.muted = false;
      await video.play();
      await startSpamLoop(); // trigger the cursed loop
    };

    window.addEventListener('click', startVideo, { once: true });
  </script>
</body>
</html>
