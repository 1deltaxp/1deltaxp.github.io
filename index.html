<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kms</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background: black;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #mainVideo {
      display: none;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #startText {
      color: white;
      font-family: sans-serif;
      font-size: 2rem;
      position: absolute;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="startText">click anywhere to start</div>

  <video id="mainVideo" loop>
    <source src="video.mp4" type="video/mp4" />
    ur browser doesn't support video :(
  </video>

  <script>
    const video = document.getElementById('mainVideo');
    const text = document.getElementById('startText');

    const startVideo = () => {
      text.style.display = 'none';
      video.style.display = 'block';
      video.muted = false;
      video.play();
    };

    window.addEventListener('click', startVideo, { once: true });
  </script>
</body>
</html>
