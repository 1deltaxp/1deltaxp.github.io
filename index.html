<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>stay</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video id="mainVideo" autoplay loop muted playsinline>
  <source src="video.mp4" type="video/mp4" />
  ur browser doesn't support video :(
</video>


  <script>
    // in case autoplay gets blocked
    const vid = document.getElementById('mainVideo');
    window.addEventListener('click', () => {
      if (vid.paused) {
        vid.play();
      }
    });
  </script>
</body>
</html>
