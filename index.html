<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>stay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: none; /* cursor vanish */
    }

    body {
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.1s ease;
    }

    #mainVideo {
      display: none;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform-origin: center;
    }

    #startText {
      color: white;
      font-family: sans-serif;
      font-size: 2rem;
      position: absolute;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .glitch {
      position: absolute;
      color: white;
      font-family: monospace;
      font-size: 2rem;
      pointer-events: none;
      mix-blend-mode: difference;
      animation: fadeOut 1s forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateY(-10px);
      }
    }

    #bluescreen {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #0000aa;
      color: white;
      font-family: monospace;
      font-size: 1.5rem;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="startText">...</div>

  <video id="mainVideo" loop>
    <source src="video.mp4" type="video/mp4" />
    ur browser doesn't support video :(
  </video>

  <div id="bluescreen">
    😵 Windows has encountered a fatal error.<br/><br/>
    Press Ctrl+Alt+Del to restart. Or just cry lmao.
  </div>

  <audio id="staticAudio" loop>
    <source src="https://cdn.pixabay.com/audio/2022/03/14/audio_b493b269d.mp3" type="audio/mpeg">
  </audio>

  <script>
    const video = document.getElementById('mainVideo');
    const text = document.getElementById('startText');
    const staticAudio = document.getElementById('staticAudio');
    const bluescreen = document.getElementById('bluescreen');

    const colors = ['black', 'white'];
    const glitchWords = ['THEY HATE YOU', 'YOURE NOT WORTH IT', 'HELP', 'PLEASE SAVE ME', 'WAKE UP', 'THEY SEE YOU', '...'];

    const random = (arr) => arr[Math.floor(Math.random() * arr.length)];

    const flashScreen = () => {
      setInterval(() => {
        document.body.style.backgroundColor = random(colors);
      }, 1);
    };

    const spawnGlitchText = () => {
      setInterval(() => {
        const glitch = document.createElement('div');
        glitch.textContent = random(glitchWords);
        glitch.className = 'glitch';
        glitch.style.top = Math.random() * 100 + '%';
        glitch.style.left = Math.random() * 100 + '%';
        document.body.appendChild(glitch);
        setTimeout(() => glitch.remove(), 1000);
      }, 300);
    };

    const rotateVideo = () => {
      let angle = 0;
      setInterval(() => {
        angle += 5;
        video.style.transform = `rotate(${angle}deg)`;
      }, 1);
    };

    const maybeBlueScreen = () => {
      setTimeout(() => {
        if (Math.random() < 0.3) { // 30% chance of bsod
          bluescreen.style.display = 'flex';
          video.pause();
          staticAudio.pause();
        }
      }, 15000); // happens after 15 secs
    };

    const startVideo = async () => {
      text.style.display = 'none';
      video.style.display = 'block';
      await video.play();
      staticAudio.volume = 0.5;
      staticAudio.play();

      // Start the cursed effects
      flashScreen();
      spawnGlitchText();
      rotateVideo();
      maybeBlueScreen();
    };

    window.addEventListener('click', startVideo, { once: true });
  </script>
</body>
</html>
